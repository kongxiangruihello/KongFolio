name: PDF page text diagnostics
on:
  push:
    branches: [codex/diagnose-pdf-page-text]
jobs:
  focused:
    runs-on: macos-26
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Test PDF page text and blank close
        env:
          NSUnbufferedIO: 'YES'
        run: |
          set -o pipefail
          mkdir -p ci-logs
          swift test --filter PDFCreationTests 2>&1 | tee ci-logs/xctest.log
      - name: Report failures
        if: always()
        run: ./scripts/ci-annotate.sh ci-logs macos-26
