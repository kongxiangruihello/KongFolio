name: PDF making diagnostics
on:
  push:
    branches: [codex/diagnose-pdf-making]
jobs:
  focused:
    runs-on: macos-15
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Run PDF making tests
        env:
          NSUnbufferedIO: 'YES'
        run: |
          set -o pipefail
          mkdir -p ci-logs
          swift test --filter PDFCreationTests 2>&1 | tee ci-logs/xctest.log
      - name: Report failures
        if: always()
        run: ./scripts/ci-annotate.sh ci-logs macos-15
