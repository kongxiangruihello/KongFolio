name: PDF page text macOS 15 diagnostics
on:
  push:
    branches: [codex/diagnose-pdf-text-macos15]
jobs:
  focused:
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Test PDF creation and page editing
        env:
          NSUnbufferedIO: 'YES'
        run: |
          set -o pipefail
          mkdir -p ci-logs
          swift test --filter 'PDFCreationTests|PDFTextSnapshot053Tests|VersionFourTests|Reading053WorkflowTests' 2>&1 | tee ci-logs/xctest.log
      - name: Report failures
        if: always()
        run: ./scripts/ci-annotate.sh ci-logs macos-15
