name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version || true
      - name: Build (debug)
        run: |
          set -o pipefail
          mkdir -p ci-logs
          swift build 2>&1 | tee ci-logs/build.log
      - name: XCTest
        if: success() || failure()
        run: |
          set -o pipefail
          mkdir -p ci-logs
          swift test 2>&1 | tee ci-logs/xctest.log
      - name: Portable test script
        if: success() || failure()
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./scripts/test.sh 2>&1 | tee ci-logs/smoke.log
      - name: Release build
        if: success() || failure()
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee ci-logs/release.log
      - name: Icon preview
        if: success() || failure()
        run: |
          swift scripts/Icon.swift "$RUNNER_TEMP/iconset"
          [ "${{ matrix.os }}" = "macos-15" ] && echo "::notice title=icon256 base64::$(base64 -i "$RUNNER_TEMP/iconset/icon_256x256.png" | tr -d '\n')" || true
      - name: Report as annotations
        if: always()
        run: ./scripts/ci-annotate.sh ci-logs ${{ matrix.os }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.os }}
          path: ci-logs
          if-no-files-found: ignore
