name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version || true
      - name: Build (debug)
        run: |
          set -o pipefail
          mkdir -p ci-logs
          swift build 2>&1 | tee ci-logs/build.log
      - name: XCTest
        if: success() || failure()
        timeout-minutes: 12
        env:
          # Unbuffered output shows which test was running if one ever hangs.
          NSUnbufferedIO: "YES"
        run: |
          set -o pipefail
          mkdir -p ci-logs
          swift test 2>&1 | tee ci-logs/xctest.log
      - name: Portable test script
        if: success() || failure()
        # Compiling the standalone test runner can take over ten minutes on a slow host.
        timeout-minutes: 20
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./scripts/test.sh 2>&1 | tee ci-logs/smoke.log
      - name: Release build
        if: success() || failure()
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee ci-logs/release.log
      - name: Icon preview
        if: success() || failure()
        run: |
          swift scripts/Icon.swift "$RUNNER_TEMP/iconset"
          if [ "${{ matrix.os }}" = "macos-15" ]; then base64 -i "$RUNNER_TEMP/iconset/icon_128x128@2x.png" | tr -d '\n' | fold -w 3800 | nl -nln | while read -r n chunk || [ -n "$chunk" ]; do echo "::notice title=icon part $n::$chunk"; done; fi
      - name: Report as annotations
        if: always()
        run: ./scripts/ci-annotate.sh ci-logs ${{ matrix.os }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.os }}
          path: ci-logs
          if-no-files-found: ignore
      - name: Failure summary
        if: always()
        run: ./scripts/ci-summary.sh ci-logs ${{ matrix.os }}

  release-v06058:
    needs: macos
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: release-v0.60.58
      cancel-in-progress: false
    env:
      TAG: v0.60.58
      VERSION: 0.60.58
      BUILD_NUMBER: 145
    steps:
      - uses: actions/checkout@v4
      - name: Check release version and tag
        id: version
        run: |
          set -euo pipefail
          if [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)" != "$VERSION" ]]; then
            exit 0
          fi
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]]; then
            exit 0
          fi
          echo "package=true" >> "$GITHUB_OUTPUT"
      - name: Build and verify DMG and ZIP
        if: steps.version.outputs.package == 'true'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          ./scripts/build.sh
          mkdir -p "$RUNNER_TEMP/release"
          dmg="KongFolio-$VERSION-arm64.dmg"
          zip="KongFolio-$VERSION-macOS.zip"
          ./scripts/dmg.sh "$RUNNER_TEMP/release/$dmg"
          mv "../$zip" "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release"
          hdiutil verify "$dmg"
          unzip -tq "$zip"
          extracted="$(mktemp -d)"
          ditto -x -k "$zip" "$extracted"
          app="$extracted/KongFolio.app"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$BUILD_NUMBER"
          shasum -a 256 "$dmg" "$zip" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Publish verified assets
        if: steps.version.outputs.package == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          gh release create "$TAG" "KongFolio-$VERSION-arm64.dmg" "KongFolio-$VERSION-macOS.zip" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KongFolio $VERSION" \
            --notes-file "$GITHUB_WORKSPACE/RELEASE-$VERSION.md"
